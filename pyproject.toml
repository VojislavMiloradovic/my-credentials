[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "my-credentials"
version = "0.1.0"
description = "Automated profile sync and AI-readable archives for learning achievements."
requires-python = "==3.11.*"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "jsonschema==4.26.0",
    "tiktoken==0.13.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["ruff==0.16.2"]

[tool.uv]
package = false
required-version = ">=0.4.0"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DTZ", # flake8-datetimez (enforces timezone-aware datetimes)
]

# Suppressions for naive datetimes (DTZ005, DTZ007) and broad exception handling (BLE001, S110, TRY002) removed.
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
