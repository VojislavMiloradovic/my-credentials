[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "my-credentials"
version = "0.1.0"
description = "Automated profile sync and AI-readable archives for learning achievements."
requires-python = ">=3.11,<3.12"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "jsonschema==4.26.0",
    "tiktoken==0.13.0",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = ["ruff==0.16.2"]
test = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "responses==0.25.0",
    "freezegun==1.5.1",
    "mypy==1.13.0",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DTZ", # flake8-datetimez (enforces timezone-aware datetimes)
]

# Suppressions for naive datetimes (DTZ005, DTZ007) and broad exception handling (BLE001, S110, TRY002) removed.
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for core modules",
    "integration: Integration tests for provider pipelines",
    "smoke: CLI smoke tests",
    "slow: Tests that take longer than 5 seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# Only type-check test files; don't follow imports into source files
# which have pre-existing type issues not related to test changes.
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = false
