name: Cross-Artifact Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every 3 days to catch cross-artifact drift
    - cron: '0 6 */3 * *'
  workflow_dispatch:

# No concurrency lock - read-only workflow (uploads artifacts only)
# Add concurrency: git-push-main only if this workflow ever writes to main

jobs:
  cross-artifact-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run cross-artifact validator
        run: |
          mkdir -p validation_reports
          # Keep last 3 reports: rotate by removing oldest if 3+ exist
          if [ -d validation_reports ]; then
            ls -t validation_reports/cross_artifact_report_*.json 2>/dev/null | tail -n +4 | xargs -r rm -f
          fi
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          uv run python cross_artifact_validator.py --mode strict --report validation_reports/cross_artifact_report_${TIMESTAMP}.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-artifact-report
          path: validation_reports/cross_artifact_report_*.json
          retention-days: 30

      - name: Display validation summary
        if: always()
        run: |
          if [ -f validation_reports/cross_artifact_report_*.json ]; then
            echo "=== Cross-Artifact Validation Summary ==="
            python validation_summary.py
          else
            echo "No validation report generated"
          fi