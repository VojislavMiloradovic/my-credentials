name: Link Health Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Automatically runs every Sunday at 00:00 UTC
  workflow_dispatch: # Enables manual triggers from the Actions tab

# Serialize with all write-capable workflows to prevent push/rebase races
concurrency:
  group: git-push-main
  cancel-in-progress: false

permissions:
  contents: write # Needed to commit JSON results back to repo
  issues: write # Allows lychee to automatically open a GitHub Issue if dead links are found

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Lychee Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Install lychee
        run: |
          set -euo pipefail
          # Install lychee from pre-built binary with SHA-256 verification
          LYCHEE_VERSION="0.15.0"
          LYCHEE_SHA256="58813e400b06e1d36df090a1673269d4187d8206fdc6826f75578b273759a65f"
          LYCHEE_TARBALL="${{ runner.temp }}/lychee-v${LYCHEE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/v${LYCHEE_VERSION}/lychee-v${LYCHEE_VERSION}-x86_64-unknown-linux-musl.tar.gz" -o "${LYCHEE_TARBALL}"
          echo "${LYCHEE_SHA256}  ${LYCHEE_TARBALL}" | sha256sum -c -
          tar -xzf "${LYCHEE_TARBALL}" -C "${{ runner.temp }}" lychee
          rm -f "${LYCHEE_TARBALL}"
          sudo install -m 0755 "${{ runner.temp }}/lychee" /usr/local/bin/lychee
          rm -f "${{ runner.temp }}/lychee"
          lychee --version

      - name: Build .lycheeignore
        run: uv run python build_exclude.py

      - name: Run Link Checker (JSON output to file, text progress to console)
        id: lychee
        continue-on-error: true
        run: |
          # Default files to check (same as workflow)
          FILES=(
            "README.md"
            "llms.txt"
            "llms-full.txt"
          )

          # Add archive files
          for f in archives/*.md; do
            [ -f "$f" ] && FILES+=("$f")
          done

          # Also check old archive dir if exists
          if [ -d "archive" ]; then
            for f in archive/*.md; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi

          # Build lychee arguments - JSON to stdout (captured), text progress to stderr (console)
          ARGS=(
            "--format" "json"
            "--no-progress"
            "--config" "lychee.toml"
            "--exclude" "(linkedin\\.com/in/|credly\\.com/users/)"
            "${FILES[@]}"
          )

          echo "Running lychee with ${#FILES[@]} files..."
          # IMPORTANT: Only capture stdout (JSON) to file; stderr (progress) goes to console
          # Don't fail on non-zero exit codes - we want to process results regardless
          lychee "${ARGS[@]}" > lychee_results.json
          EXIT_CODE=$?
          echo "lychee exited with code $EXIT_CODE"
          echo "lychee_results.json created ($(wc -c < lychee_results.json) bytes)"

      - name: Save JSON results (latest + previous)
        run: |
          mkdir -p link_check_results
          # Rotate: previous <- latest, latest <- current
          if [ -f link_check_results/latest.json ]; then
            mv link_check_results/latest.json link_check_results/previous.json
          fi
          mv lychee_results.json link_check_results/latest.json
          echo "Saved to link_check_results/latest.json and previous.json"

      - name: Generate Summary
        run: uv run python run_link_checker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit JSON results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link_check_results/
          git diff --staged --quiet || git commit -m "chore: update link check results [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
