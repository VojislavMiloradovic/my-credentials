name: Link Health Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Automatically runs every Sunday at 00:00 UTC
  workflow_dispatch: # Enables manual triggers from the Actions tab

permissions:
  contents: write # Needed to commit JSON results back to repo
  issues: write # Allows lychee to automatically open a GitHub Issue if dead links are found

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Lychee Cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      - name: Install lychee
        run: |
          # Install lychee from pre-built binary
          LYCHEE_VERSION="0.15.0"
          curl -L "https://github.com/lycheeverse/lychee/releases/download/v${LYCHEE_VERSION}/lychee-v${LYCHEE_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo mv lychee /usr/local/bin/
          lychee --version

      - name: Build .lycheeignore
        run: uv run python build_exclude.py

      - name: Run Link Checker (JSON output to file, text progress to console)
        id: lychee
        continue-on-error: true
        run: |
          # Default files to check (same as workflow)
          FILES=(
            "README.md"
            "llms.txt"
            "llms-full.txt"
          )

          # Add archive files
          for f in archives/*.md; do
            [ -f "$f" ] && FILES+=("$f")
          done

          # Also check old archive dir if exists
          if [ -d "archive" ]; then
            for f in archive/*.md; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi

          # Build lychee arguments - JSON to stdout (captured), text progress to stderr (console)
          ARGS=(
            "--format" "json"
            "--no-progress"
            "--config" "lychee.toml"
            "--exclude" "(linkedin\\.com/in/|credly\\.com/users/)"
            "${FILES[@]}"
          )

          echo "Running lychee with ${#FILES[@]} files..."
          # IMPORTANT: Only capture stdout (JSON) to file; stderr (progress) goes to console
          # Don't fail on non-zero exit codes - we want to process results regardless
          lychee "${ARGS[@]}" > lychee_results.json
          EXIT_CODE=$?
          echo "lychee exited with code $EXIT_CODE"
          echo "lychee_results.json created ($(wc -c < lychee_results.json) bytes)"

      - name: Save JSON results (latest + previous)
        run: |
          mkdir -p link_check_results
          # Rotate: previous <- latest, latest <- current
          if [ -f link_check_results/latest.json ]; then
            mv link_check_results/latest.json link_check_results/previous.json
          fi
          mv lychee_results.json link_check_results/latest.json
          echo "Saved to link_check_results/latest.json and previous.json"

      - name: Generate Summary
        run: uv run python run_link_checker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit JSON results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add link_check_results/
          git diff --staged --quiet || git commit -m "chore: update link check results [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}