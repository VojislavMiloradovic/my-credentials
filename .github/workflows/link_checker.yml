name: Link Health Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Automatically runs every Sunday at 00:00 UTC
  workflow_dispatch: # Enables manual triggers from the Actions tab

permissions:
  contents: read
  issues: write # Allows lychee to automatically open a GitHub Issue if dead links are found

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore Lychee Cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Build Retired URL Exclude Pattern
        id: retired-urls
        run: |
          python -c "
import json, glob, sys, re
retired = []
for f in glob.glob('for_validation/*.json'):
    try:
        with open(f, 'r', encoding='utf-8') as fp:
            data = json.load(fp)
            for item in data:
                if isinstance(item, dict) and item.get('retired') and item.get('url'):
                    url = item['url']
                    # Escape for regex
                    escaped = re.escape(url)
                    retired.append(escaped)
    except Exception as e:
        print(f'Warning: Could not parse {f}: {e}', file=sys.stderr)
if retired:
    pattern = '(' + '|'.join(retired) + ')'
    print(f'exclude_pattern={pattern}')
else:
    print('exclude_pattern=')
          " >> $GITHUB_OUTPUT

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config lychee.toml
            --exclude "(linkedin\.com/in/|credly\.com/users/)"
            ${{ steps.retired-urls.outputs.exclude_pattern != '' && format('--exclude \"{0}\"', steps.retired-urls.outputs.exclude_pattern) || '' }}
            "README.md" "llms.txt" "llms-full.txt" "archive/*.md" "archives/*.md"
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
