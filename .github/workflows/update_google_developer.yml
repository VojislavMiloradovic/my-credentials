name: Update Google Developer Credentials

on:
  push:
    paths:
      - 'data/google_learnings.txt'
      - 'data/*.mhtml'
  workflow_dispatch:
  schedule:
    # Every 2 days (frequent due to codelab changes)
    # Runs at 00:00 UTC - different time from 29-day jobs (06:00+) to avoid concurrency
    - cron: '0 0 */2 * *'

concurrency:
  group: git-push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile:
    uses: ./.github/workflows/reusable-update.yml
    with:
      pre_script: "scripts/sanitize_gdev_mhtml.py data/"
      script_name: update_google_developer.py
      commit_message: "chore(google-dev): auto-update Google Developer profile, json-ld, and llms.txt"
      platform: google-developer
      artifact_paths: '["data/", "for_validation/", "archives/", "README.md", "credentials.jsonld", "credentials.feed.json", "credentials.ndjson", "llms.txt", "llms-full.txt", "validation_reports/", "retired_urls.json"]'
    permissions:
      contents: write
