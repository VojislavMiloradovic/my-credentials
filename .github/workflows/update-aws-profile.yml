name: Update AWS Learn Profile

on:
  push:
    paths:
      - 'data/aws-training-activity.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aws:
    uses: ./.github/workflows/reusable-update.yml
    with:
      script_name: update_aws_skills.py
      commit_message: "chore(aws): auto-update AWS profile, json-ld, and llms.txt"
