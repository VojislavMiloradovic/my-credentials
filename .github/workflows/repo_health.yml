name: Security & Repository Health Checks

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/microsoft-learn.json'
      - 'data/*.mhtml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
# Queue health checks sequentially with sync workflows
concurrency:
  group: git-push-main
  cancel-in-progress: false

jobs:
  security-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Set up Python environment first
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      # 2. Scan committed repository as-is (without pre-sanitizing runner files)
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Strictly verify Python code quality
      - name: Run Ruff Linter
        run: uv run ruff check *.py

      # 4. Verify syntax integrity of raw JSON data files
      - name: Validate Data JSON Integrity
        run: |
          uv run python -c "
          import glob, json
          json_files = glob.glob('data/*.json') + glob.glob('*.json')
          for f in json_files:
              with open(f, 'r', encoding='utf-8') as fp:
                  json.load(fp)
          print(f'Successfully validated syntax for {len(json_files)} JSON file(s).')
          "
