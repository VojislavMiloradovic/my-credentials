name: Security & Repository Health Checks

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/microsoft-learn.json'
      - 'data/*.mhtml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
# Queue health checks sequentially with sync workflows
concurrency:
  group: git-push-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  security-and-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 1. Set up Python environment first
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      # 2. Scan committed repository as-is (without pre-sanitizing runner files)
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Strictly verify Python code quality
      - name: Run Ruff Linter
        run: uv run ruff check *.py

      # 4. Verify syntax integrity of raw JSON data files
      - name: Validate Data JSON Integrity
        run: |
          uv run python -c "
          import glob, json
          json_files = glob.glob('data/*.json') + glob.glob('*.json')
          for f in json_files:
              with open(f, 'r', encoding='utf-8') as fp:
                  json.load(fp)
          print(f'Successfully validated syntax for {len(json_files)} JSON file(s).')
          "
