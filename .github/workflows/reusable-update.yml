name: Reusable Platform Sync Workflow

on:
  workflow_call:
    inputs:
      script_name:
        description: "Python script to execute for platform sync (e.g., update_ms_learn.py)"
        required: true
        type: string
      commit_message:
        description: "Git commit message for changes"
        required: false
        type: string
        default: "chore: auto-update platform data, json-ld, and llms.txt"

permissions:
  contents: write

jobs:
  sync-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      # --- PRE-FLIGHT HEALTH & SECURITY CHECKS ---
      - name: Sanitize Microsoft Learn Data (If Present)
        run: |
          if [ -f "microsoft-learn.json" ]; then
            uv run python sanitize_ms_export.py microsoft-learn.json
          fi
          if [ -f "data/microsoft-learn.json" ]; then
            uv run python sanitize_ms_export.py data/microsoft-learn.json
          fi

      - name: Run Ruff Linter
        run: uv run ruff check *.py

      - name: Validate Data JSON Integrity
        run: |
          uv run python -c "
          import glob, json
          json_files = glob.glob('data/*.json') + glob.glob('*.json')
          for f in json_files:
              with open(f, 'r', encoding='utf-8') as fp:
                  json.load(fp)
          print(f'Successfully validated syntax for {len(json_files)} JSON file(s).')
          "

      # --- EXECUTION & UPDATE PHASE ---
      - name: Run Platform Script
        run: uv run python ${{ inputs.script_name }}

      - name: Generate JSON-LD Linked Data
        run: uv run python generate_jsonld.py

      - name: Generate LLMs.txt Directory Files
        run: uv run python generate_llms_txt.py

      # --- REBASE SAFE COMMIT & PUSH ---
      - name: Commit and Push Changes (Rebase Safe)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "${{ inputs.commit_message }}"
            git pull --rebase origin main
            git push
          fi
