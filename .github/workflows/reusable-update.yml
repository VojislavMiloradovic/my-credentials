name: Reusable Update Workflow

on:
  workflow_call:
    inputs:
      script_name:
        required: true
        type: string
        description: "Python script to execute (e.g., update_google_skills.py)"
      commit_message:
        required: true
        type: string
        description: "Commit message for updated data"
      profile_id_env_var:
        required: false
        type: string
        description: "Name of the profile ID env variable"
      profile_id_value:
        required: false
        type: string
        description: "Value of the profile ID"

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      # Pre-flight JSON Integrity Check (Retained before scraping)
      - name: Validate Existing Data JSON Integrity
        run: |
          uv run python -c "
          import glob, json, sys
          json_files = glob.glob('for_validation/*.json') + glob.glob('data/*.json')
          if not json_files:
              print('No JSON files found for validation pre-check.')
              sys.exit(0)
          for f in json_files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
              except Exception as e:
                  print(f'❌ Corrupted JSON detected in {f}: {e}')
                  sys.exit(1)
          print(f'✅ Pre-flight: Validated syntax for {len(json_files)} JSON file(s).')
          "

      - name: Execute Scraper Script
        env:
          GOOGLE_PROFILE_ID: ${{ inputs.profile_id_value }}
        run: uv run python ${{ inputs.script_name }}

      - name: Generate JSON-LD Linked Data
        run: uv run python generate_jsonld.py

      - name: Generate LLMs.txt Directory Files
        run: uv run python generate_llms_txt.py

      - name: Commit and Push Changes (Rebase-Safe with Retry)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stash any local changes generated by the scripts
          git stash push -u -m "workflow-changes-$(date +%s)"
          
          # Fetch latest main and rebase local commits on top
          git fetch origin main
          git rebase origin/main || { echo "❌ Rebase failed - resolve conflicts manually"; git stash pop; exit 1; }
          
          # Restore stashed changes
          git stash pop
          
          # Stage explicit artifact paths only
          git add for_validation/ archives/ README.md
          
          if ! git diff --staged --quiet; then
            git commit -m "${{ inputs.commit_message }}"
            
            # Push with retry (3 attempts, exponential backoff)
            for attempt in 1 2 3; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                exit 0
              fi
              echo "⚠️ Push attempt $attempt failed, retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            echo "❌ Push failed after 3 attempts"
            exit 1
          else
            echo "No data changes detected."
          fi
