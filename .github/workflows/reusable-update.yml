name: Reusable Update Workflow

on:
  workflow_call:
    inputs:
      script_name:
        required: true
        type: string
        description: "Python script to execute (e.g., update_google_skills.py)"
      commit_message:
        required: true
        type: string
        description: "Commit message for updated data"
      profile_id_env_var:
        required: false
        type: string
        description: "Name of the profile ID env variable"
      profile_id_value:
        required: false
        type: string
        description: "Value of the profile ID"
      platform:
        required: false
        type: string
        description: "Platform name for targeted validation (e.g., microsoft-learn)"
      artifact_paths:
        required: false
        type: string
        description: 'JSON array of paths to stage (default: all standard artifacts)'
        default: '["for_validation/", "archives/", "README.md", "credentials.jsonld", "llms.txt", "llms-full.txt"]'

jobs:
  update-credentials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.3'

      - name: Install Dependencies
        run: uv sync --frozen --all-extras

      # Pre-flight JSON Integrity Check (Retained before scraping)
      - name: Validate Existing Data JSON Integrity
        run: |
          uv run python -c "
          import glob, json, sys, os
          platform = '${{ inputs.platform }}'
          if platform:
              json_files = glob.glob(f'for_validation/{platform}-*.json') + glob.glob(f'data/{platform}.json')
          else:
              json_files = glob.glob('for_validation/*.json') + glob.glob('data/*.json')
          if not json_files:
              print('No JSON files found for validation pre-check.')
              sys.exit(0)
          for f in json_files:
              try:
                  with open(f, 'r', encoding='utf-8') as fp:
                      json.load(fp)
              except Exception as e:
                  print(f'❌ Corrupted JSON detected in {f}: {e}')
                  sys.exit(1)
          print(f'✅ Pre-flight: Validated syntax for {len(json_files)} JSON file(s).')
          "

      - name: Execute Scraper Script
        env:
          GOOGLE_PROFILE_ID: ${{ inputs.profile_id_value }}
        run: uv run python ${{ inputs.script_name }}

      - name: Generate JSON-LD Linked Data
        run: uv run python generate_jsonld.py

      - name: Generate LLMs.txt Directory Files
        run: uv run python generate_llms_txt.py

      - name: Generate LLMs-Full Consolidated Export
        run: uv run python generate_llms_full.py

      # Validate artifact_paths input
      - name: Validate Artifact Paths
        run: |
          set -euo pipefail
          ARTIFACT_PATHS='${{ inputs.artifact_paths }}'
          
          # 1. Valid JSON array
          echo "$ARTIFACT_PATHS" | jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null || {
            echo "❌ artifact_paths must be a JSON array of strings"
            exit 1
          }
          
          # 2. Required paths present (core artifacts that must always be staged)
          REQUIRED_PATHS=("for_validation/" "archives/" "README.md" "credentials.jsonld" "llms.txt" "llms-full.txt")
          for req in "${REQUIRED_PATHS[@]}"; do
            if ! echo "$ARTIFACT_PATHS" | jq -e --arg p "$req" 'index($p)' >/dev/null; then
              echo "❌ Required artifact path missing: $req"
              exit 1
            fi
          done
          
          # 3. No path traversal, no absolute paths
          echo "$ARTIFACT_PATHS" | jq -r '.[]' | while IFS= read -r path; do
            if [[ "$path" == /* ]] || [[ "$path" == *".."* ]]; then
              echo "❌ Invalid path (absolute or traversal): $path"
              exit 1
            fi
            # Warn if path doesn't exist yet (may be generated later)
            if [ ! -e "$path" ] && [ ! -d "$(dirname "$path")" ]; then
              echo "⚠️ Path does not exist (may be generated): $path"
            fi
          done
          
          echo "✅ Artifact paths validation passed"

      - name: Commit and Push Changes (Rebase-Safe with Retry)
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cleanup orphaned stashes on exit (crash, timeout, cancel)
          trap 'git stash list | grep "workflow-changes-" | cut -d: -f1 | xargs -r git stash drop 2>/dev/null || true' EXIT
          
          # Stash any local changes generated by the scripts (only if changes exist)
          STASH_MSG="workflow-changes-$(date +%s)-$$"
          STASH_CREATED=false
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push -u -m "$STASH_MSG"
            STASH_CREATED=true
          fi
          
          # Fetch latest main and rebase local commits on top
          git fetch origin main
          if ! git rebase origin/main; then
            echo "❌ Rebase failed. Conflicting files:"
            git diff --name-only --diff-filter=U
            echo ""
            echo "To resolve manually:"
            echo "  1. Edit conflicting files above"
            echo "  2. git add <resolved-files>"
            echo "  3. git rebase --continue"
            if [ "$STASH_CREATED" = true ]; then
              echo "  4. git stash pop  # restore workflow changes"
              git stash pop
            fi
            exit 1
          fi
          
          # Restore stashed changes (only if stash was created)
          if [ "$STASH_CREATED" = true ]; then
            git stash pop
          fi
          
          # Stage artifact paths from input (JSON array)
          ARTIFACT_PATHS='${{ inputs.artifact_paths }}'
          for path in $(echo "$ARTIFACT_PATHS" | jq -r '.[]'); do
            git add "$path"
          done
          
          if ! git diff --staged --quiet; then
            git commit -m "${{ inputs.commit_message }}"
            
            # Push with retry (3 attempts, exponential backoff) - only on network errors
            for attempt in 1 2 3; do
              PUSH_OUTPUT=$(git push 2>&1)
              PUSH_EXIT=$?
              if [ $PUSH_EXIT -eq 0 ]; then
                echo "✅ Push succeeded on attempt $attempt"
                
                # Verify remote HEAD matches local
                git fetch origin main
                LOCAL_HEAD=$(git rev-parse HEAD)
                REMOTE_HEAD=$(git rev-parse origin/main)
                if [ "$LOCAL_HEAD" = "$REMOTE_HEAD" ]; then
                  echo "✅ Remote HEAD verified: $LOCAL_HEAD"
                  
                  # Step summary for Actions UI
                  {
                    echo "## 📦 Commit Summary"
                    echo "- **Commit:** $(git rev-parse --short HEAD)"
                    echo "- **Message:** ${{ inputs.commit_message }}"
                    echo "- **Changed files:**"
                    git diff --name-only HEAD~1 | sed 's/^/  - /'
                  } >> $GITHUB_STEP_SUMMARY
                  
                  exit 0
                else
                  echo "❌ Remote HEAD mismatch! Local: $LOCAL_HEAD, Remote: $REMOTE_HEAD"
                  exit 1
                fi
              fi
              
              # Only retry on transient network errors
              if echo "$PUSH_OUTPUT" | grep -qE "(Connection|timeout|network|temporary|unable to connect|Could not resolve)"; then
                echo "⚠️ Push attempt $attempt failed (network error), retrying in $((attempt * 5))s..."
                echo "$PUSH_OUTPUT"
                sleep $((attempt * 5))
              else
                echo "❌ Push failed (non-retryable error):"
                echo "$PUSH_OUTPUT"
                exit 1
              fi
            done
            echo "❌ Push failed after 3 attempts"
            exit 1
          else
            echo "No data changes detected."
            
            # Step summary for no-changes case
            {
              echo "## 📦 Commit Summary"
              echo "- **Status:** No changes detected"
              echo "- **Message:** ${{ inputs.commit_message }}"
            } >> $GITHUB_STEP_SUMMARY
          fi
