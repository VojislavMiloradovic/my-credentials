name: Sync Google Skills Profile

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: git-push-main
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/reusable-update.yml
    with:
      script_name: update_google_skills.py
      commit_message: "chore(google-skills): auto-update Google Skills profile, json-ld, and llms.txt"
    permissions:
      contents: write
