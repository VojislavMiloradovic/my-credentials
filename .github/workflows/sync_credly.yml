name: Sync Credly Profile

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: git-push-main
  cancel-in-progress: false

jobs:
  sync-credly:
    uses: ./.github/workflows/reusable-update.yml
    with:
      script_name: update_credly_badges.py
      commit_message: "chore(credly): auto-update Credly profile, json-ld, and llms.txt"
      platform: credly
    permissions:
      contents: write
