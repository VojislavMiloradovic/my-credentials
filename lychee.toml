# lychee configuration for link checking
# Global settings (must come FIRST in TOML)

verbose = "info"
no_progress = true
format = "detailed"
mode = "color"
max_concurrency = 10
max_retries = 0
timeout = 20
retry_wait_time = 1
accept = ["200", "204", "301", "302", "429"]
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
cache = true
max_cache_age = "7d"
host_concurrency = 10
host_request_interval = "50ms"
scheme = ["https"]
require_https = false
method = "get"

# Per-host rate limiting for known sensitive domains (must come LAST)

[hosts."linkedin.com"]
concurrency = 2
request_interval = "1s"

[hosts."credly.com"]
concurrency = 2
request_interval = "1s"